name = "aurashop-marketplace"
main = "src/edge/worker.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
DEFAULT_CURRENCY = "ETB"
NODE_ENV = "production"
TELEGRAM_BOT_USERNAME = "aurashop_marketplace_bot"
TELEGRAM_CHANNEL_ID = "@Aurashop_marketplace"
ADMIN_TELEGRAM_IDS = "1890482340,7117509984,5356565604,8282129488"
ADMIN_CHAT_ID = "1890482340"
MONGODB_DATABASE = "efootball"
MONGODB_DATA_SOURCE = "Cluster0"
MONGODB_DATA_API_URL = "https://data.mongodb.com/api/app/data-v2.endpoint/data/v1"
APP_URL = "https://aurashop-marketplace.<your-subdomain>.workers.dev"

[env.production.vars]
NODE_ENV = "production"

[env.preview.vars]
NODE_ENV = "development"

[[kv_namespaces]]
binding = "TELEGRAM_SESSIONS"
id = "your-kv-namespace-id"
preview_id = "your-preview-kv-namespace-id"

[triggers]
crons = ["*/5 * * * *"]

[env.production.triggers]
crons = ["*/5 * * * *"]
