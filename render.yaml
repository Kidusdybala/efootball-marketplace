services:
  - type: web
    name: aurashop-backend
    env: node
    buildCommand: npm install --prefix backend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: PAYMENT_INSTRUCTIONS
        sync: false
      - key: SERVICE_FEE_RATE
        value: "0.1"
      - key: ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
